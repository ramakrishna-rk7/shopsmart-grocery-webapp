<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="section-title mb-0">Manage Products</h2>
            <p class="section-subtitle mb-0">{{products.length}} products total</p>
        </div>
        <div class="d-flex gap-2">
            <a routerLink="/admin" class="btn btn-outline-primary btn-sm"><i
                    class="fas fa-arrow-left me-1"></i>Dashboard</a>
            <button class="btn btn-primary btn-sm" (click)="openAdd()"><i class="fas fa-plus me-1"></i>Add
                Product</button>
        </div>
    </div>

    <div class="alert-success-custom mb-3" *ngIf="success"><i class="fas fa-check-circle me-2"></i>{{success}}</div>
    <div class="alert-error-custom mb-3" *ngIf="error"><i class="fas fa-exclamation-circle me-2"></i>{{error}}</div>

    <!-- Form Modal -->
    <div *ngIf="showForm"
        style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="card-dark p-5" style="width:100%;max-width:560px;max-height:90vh;overflow-y:auto;">
            <h5 style="font-weight:700;margin-bottom:20px;">{{editingId ? 'Edit' : 'Add'}} Product</h5>
            <form [formGroup]="form" (ngSubmit)="submit()">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Product Name</label>
                        <input type="text" formControlName="name" class="form-control" placeholder="e.g. Red Apple">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Price (₹)</label>
                        <input type="number" formControlName="price" class="form-control" placeholder="40">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Stock Qty</label>
                        <input type="number" formControlName="stockQuantity" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Category</label>
                        <select formControlName="category" class="form-select">
                            <option value="">Select...</option>
                            <option *ngFor="let c of categories" [value]="c">{{c}}</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Unit</label>
                        <input type="text" formControlName="unit" class="form-control"
                            placeholder="kg, litre, piece...">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea formControlName="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Image URL</label>
                        <input type="text" formControlName="image" class="form-control" placeholder="https://...">
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary flex-grow-1" [disabled]="submitting">
                        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                        {{editingId ? 'Update' : 'Add'}} Product
                    </button>
                    <button type="button" class="btn btn-outline-primary" (click)="closeForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="spinner-wrap" *ngIf="loading">
        <div class="spinner-border spinner-border-green"></div>
    </div>

    <div class="card-dark p-0" style="overflow:hidden;" *ngIf="!loading">
        <div class="table-responsive">
            <table class="table" style="color:var(--text-main);margin:0;">
                <thead style="background:var(--bg-card2);color:var(--text-muted);font-size:0.85rem;">
                    <tr>
                        <th class="px-4 py-3">Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let p of products" style="border-color:var(--border);">
                        <td class="px-4 py-3">
                            <img [src]="p.image" [alt]="p.name"
                                style="width:48px;height:48px;border-radius:8px;object-fit:cover;"
                                onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=200'">
                        </td>
                        <td style="font-weight:600;">{{p.name}}</td>
                        <td><span class="product-category">{{p.category}}</span></td>
                        <td style="color:var(--accent);font-weight:700;">₹{{p.price}}/{{p.unit}}</td>
                        <td>{{p.stockQuantity}}</td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm" (click)="openEdit(p)"
                                    style="background:rgba(26,122,74,0.2);color:var(--primary-light);border:none;border-radius:8px;">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button *ngIf="deleteConfirmId !== p._id" class="btn btn-sm"
                                    (click)="deleteConfirmId = p._id"
                                    style="background:rgba(231,76,60,0.15);color:var(--danger);border:none;border-radius:8px;">
                                    <i class="fas fa-trash"></i>
                                </button>
                                <ng-container *ngIf="deleteConfirmId === p._id">
                                    <button class="btn btn-sm btn-danger" (click)="delete(p._id)">Confirm</button>
                                    <button class="btn btn-sm btn-outline-primary"
                                        (click)="deleteConfirmId=''">Cancel</button>
                                </ng-container>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
