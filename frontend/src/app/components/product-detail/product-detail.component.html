<div class="container py-5">
    <div class="spinner-wrap" *ngIf="loading">
        <div class="spinner-border spinner-border-green"></div>
    </div>

    <ng-container *ngIf="!loading && product">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb" style="background:none;">
                <li class="breadcrumb-item"><a routerLink="/" style="color:var(--text-muted);">Home</a></li>
                <li class="breadcrumb-item"><a routerLink="/products" style="color:var(--text-muted);">Products</a></li>
                <li class="breadcrumb-item active" style="color:var(--primary-light);">{{product.name}}</li>
            </ol>
        </nav>

        <div class="row g-5 align-items-start">
            <!-- Image -->
            <div class="col-12 col-md-5">
                <div style="border-radius:20px;overflow:hidden;aspect-ratio:1;background:var(--bg-card2);">
                    <img [src]="product.image" [alt]="product.name" style="width:100%;height:100%;object-fit:cover;"
                        onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=600'">
                </div>
            </div>

            <!-- Info -->
            <div class="col-12 col-md-7">
                <span class="product-category mb-3 d-inline-block">{{product.category}}</span>
                <h1 style="font-size:2rem;font-weight:800;margin-bottom:12px;">{{product.name}}</h1>
                <p style="color:var(--text-muted);font-size:1rem;line-height:1.7;margin-bottom:24px;">
                    {{product.description}}</p>

                <div class="d-flex align-items-baseline gap-2 mb-2">
                    <span style="font-size:2.5rem;font-weight:900;color:var(--accent);">₹{{product.price}}</span>
                    <span style="color:var(--text-muted);">per {{product.unit}}</span>
                </div>

                <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:24px;">
                    <i class="fas fa-box me-1"></i> {{product.stockQuantity}} {{product.unit}}s in stock
                </p>

                <!-- Quantity -->
                <div class="d-flex align-items-center gap-4 mb-4">
                    <div class="qty-control">
                        <button class="qty-btn" (click)="changeQty(-1)">−</button>
                        <span class="qty-value">{{quantity}}</span>
                        <button class="qty-btn" (click)="changeQty(1)">+</button>
                    </div>
                    <span style="color:var(--text-muted);font-size:0.9rem;">Total: <strong
                            style="color:var(--accent);">₹{{product.price * quantity}}</strong></span>
                </div>

                <div class="d-flex gap-3 flex-wrap">
                    <button class="btn btn-accent btn-lg px-5" (click)="addToCart()"
                        [disabled]="product.stockQuantity === 0">
                        <i class="fas" [class.fa-cart-plus]="!added" [class.fa-check]="added" class="me-2"></i>
                        {{added ? 'Added to Cart!' : (product.stockQuantity === 0 ? 'Out of Stock' : 'Add to Cart')}}
                    </button>
                    <a routerLink="/products" class="btn btn-outline-primary btn-lg px-4">
                        <i class="fas fa-arrow-left me-2"></i>Back
                    </a>
                </div>

                <!-- Features -->
                <div class="d-flex gap-3 mt-4 flex-wrap">
                    <div *ngFor="let f of [{i:'fa-leaf',t:'Fresh'},{i:'fa-truck',t:'Fast Delivery'},{i:'fa-shield-alt',t:'Quality Assured'}]"
                        style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:0.85rem;">
                        <i class="fas {{f.i}}" style="color:var(--primary-light);"></i> {{f.t}}
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>
